services:
  - type: web
    name: gartic-ai-server
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLIENT_ORIGIN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_ASSET_BASE_URL
        sync: false
      - key: AI_ENDPOINT
        sync: false
      - key: AI_API_KEY
        sync: false
