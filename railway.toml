# If no Dockerfile, Nixpacks uses these commands (monorepo root).
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build -w @drift/shared && npm run build -w @drift/server"

[deploy]
startCommand = "npm run start -w @drift/server"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
